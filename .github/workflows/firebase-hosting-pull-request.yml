# Builds each PR and deploys it to a temporary Firebase Hosting preview channel,
# posting the preview URL as a PR comment. Skipped for forks (no access to secrets).
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    # Fork PRs can't read the service-account secret; only run for same-repo PRs.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LATAM_VISUAIS }}
          projectId: latam-visuais
          # Pinned: firebase-tools 15.34.1 added an API-enabled check to the
          # hosting deploy (lib/deploy/hosting/prepare.js calls ensure() on
          # firebasehosting.googleapis.com), and the CI service account can
          # read the Hosting API but not Service Usage, so the deploy dies on
          # "403 Permission denied to get service". Unpin once the account has
          # roles/serviceusage.serviceUsageConsumer on latam-visuais.
          firebaseToolsVersion: 15.34.0
